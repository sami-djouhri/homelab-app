name: CI

# Kompiliert die App, laesst die Unit-Tests und Android-Lint laufen und legt das
# Debug-APK als Nachweis ab. Es wird BEWUSST kein GitHub-Release erzeugt: das
# Debug-APK ist unsigniert und nur ein Build-Nachweis. Der signierte Release-Build
# entsteht in der internen Verteil-Pipeline (siehe docs/ARCHITECTURE.md).
#
# Die Gateway-Adresse bleibt der eingecheckte Loopback-Platzhalter
# (siehe app/build.gradle.kts) - das oeffentliche Artefakt enthaelt keine realen
# Netzdetails.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ACTION-VERSIONEN NACHGEZOGEN (2026-10-25). checkout und upload-artifact
# standen auf v4 und damit auf Node 20, das GitHub abgekuendigt hat: die Laeufe
# wurden schon zwangsweise auf Node 24 gehoben und tragen eine Warnung. Faellt
# der Zwischenschritt weg, bricht der Build.
# Dependabot hatte genau diese Bumps vorgeschlagen und die CI hatte sie als
# GRUEN bestaetigt (#1 upload-artifact 4->7, #2 checkout 4->7, #10 setup-java
# 4->6, dazu gradle/actions 4->6). Alle wurden geschlossen, ohne gemergt zu
# werden, und ein verworfener Bot-PR kommt nicht zurueck. Deshalb standen fuer
# `github-actions` null offene PRs, was wie „nichts zu tun" aussieht und das
# Gegenteil bedeutete.
# ⚠ Bewusst Major-Tags und KEINE Commit-SHAs: der Job laeuft mit
# `permissions: contents: read` und ohne jedes Secret, die Angriffsflaeche ist
# also gering, waehrend ein SHA-Pin jeden kuenftigen Bump zur Handarbeit macht,
# und Handarbeit ist in diesem Repo genau die Stelle, an der es stehenblieb.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Android-Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Debug-APK bauen (Kompilier-Nachweis)
        run: ./gradlew --no-daemon assembleDebug

      - name: Debug-APK ablegen (unsigniert, nur zum Testen)
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-debug-unsigned
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Lint-Report ablegen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
